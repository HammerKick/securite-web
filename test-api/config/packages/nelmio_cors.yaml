nelmio_cors:
    defaults:
        allow_credentials: false
        allow_origin: ["http://localhost:5173", "http://localhost:3000"]
        allow_methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
        allow_headers: ["Content-Type", "Authorization", "X-Requested-With"]
        max_age: 3600
    paths:
        "^/api/":
            allow_origin: ["*"]
